name: Workflow para pull requests

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Set up do Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Criar ambiente virtual e instalar dependências
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Salvar ambiente virtual como artefato
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: .venv/
          include-hidden-files: true
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Set up do Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Baixar ambiente virtual salvo
        uses: actions/download-artifact@v4
        with:
          name: python-env
          path: .venv/

      - name: Restaurar permissões de execução
        run: chmod -R +x .venv/bin/

      - name: Execução dos testes
        run: |
          source .venv/bin/activate
          pytest

      - name: Verificação da cobertura
        run: |
          source .venv/bin/activate
          pytest --cov=main --cov-report=term-missing --cov-fail-under=90
