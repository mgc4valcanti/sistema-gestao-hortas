# Configurações do SonarQube Cloud (SonarCloud)
sonar.organization=vinisoaresti
sonar.projectKey=vinisoaresti_hortas
sonar.projectName=hortas

# Codificação dos arquivos fonte
sonar.sourceEncoding=UTF-8

# Definição dos diretórios de código fonte e testes
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,**/.venv/**,**/.pytest_cache/**,**/.ruff_cache/**

# Versão do Python utilizada pelo projeto (alinhada com o CI e Ruff: 3.11)
sonar.python.version=3.11

# Ignorar falso positivo da regra S8544 nos workflows do GitHub Actions
# A regra githubactions:S8544 interpreta incorretamente o argumento ':all:' de '--only-binary=:all:' como se fosse um pacote sem versão fixada
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*

